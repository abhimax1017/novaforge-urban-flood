<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress benign [vite] websocket connection error in sandboxed cloud preview where HMR is disabled
      (function() {
        var _err = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1)) {
            return;
          }
          return _err.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason || e);
          var str = String(reason && (reason.message || reason));
          if (str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>NovaForge - Urban Flood Nowcasting System</title>
    <meta name="description" content="AI-powered urban flood intelligence combining rainfall, terrain, drainage and real-time data to deliver street-level 0-3 hour flood predictions." />
    <meta property="og:title" content="NovaForge - Urban Flood Nowcasting System" />
    <meta property="og:description" content="AI-powered urban flood intelligence combining rainfall, terrain, drainage and real-time data to deliver street-level 0-3 hour flood predictions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
